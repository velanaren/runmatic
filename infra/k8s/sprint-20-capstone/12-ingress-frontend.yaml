apiVersion: networking.k8s.io/v1                                                                                          
kind: Ingress                                                                                                             
metadata:       
  name: runmatic-ingress-frontend
  namespace: default
spec:                                                                              
  ingressClassName: nginx                                         
  rules:                                                                         
    - host: runmatic.local                                                                      
      http:               
        paths:
          - path: /
            pathType: Prefix
            backend:                                                                                                      
              service:
                name: frontend-service                                                        
                port:                                                 
                  number: 3000                                                                                            
