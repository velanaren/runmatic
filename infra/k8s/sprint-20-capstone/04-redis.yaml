apiVersion: apps/v1
kind: Deployment
metadata:
  name: runmatic-redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runmatic-redis
  template:
    metadata:
      labels:
        app: runmatic-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: runmatic-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
