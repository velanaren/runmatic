apiVersion: apps/v1
kind: Deployment
metadata:
  name: runmatic-api
  namespace: default
  labels:
    app: runmatic
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runmatic-api
  template:
    metadata:
      labels:
        app: runmatic-api
    spec:
      containers:
        - name: api
          image: runmatic-api-v2:latest
          imagePullPolicy: Never   # use local image, don't try Docker Hub
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
               secretKeyRef:
                name: runmatic-secrets
                key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
               configMapKeyRef:
                name: runmatic-config
                key: REDIS_URL                                                                                               
            - name: SECRET_KEY
              valueFrom:
               secretKeyRef:
                name: runmatic-secrets
                key: SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
